company_name: Awesome ERP
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome ERP
initial_prompt: >-
  A curated directory of ERP systems for SMBs and enterprises, including
  open-source ERP. Include products such as Odoo, ERPNext, NetSuite, SAP
  S/4HANA, Microsoft Dynamics 365 Business Central, Acumatica, Sage Intacct,
  Epicor, Infor, Dolibarr, iDempiere, Ever Gauzy, plus other notable commercial
  and open-source options. Categories: SMB ERP, Enterprise ERP, Open-Source ERP,
  Manufacturing ERP, Industry ERP, E-commerce ERP. For every item capture the
  official website, a short factual description, pricing model (free, freemium,
  paid, open source), deployment (cloud or self-hosted), key features and
  integrations.


  Initial categories: SMB ERP; Enterprise ERP; Open-Source ERP; Manufacturing
  ERP; Industry ERP; E-commerce ERP.

  Target keywords: erp software, open source erp, cloud erp, erp for small
  business.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://en.wikipedia.org/wiki/List_of_ERP_software_packages

  - https://www.softwaresuggest.com/erp-software

  - https://www.saashub.com/best-erp-software

  - https://zapier.com/blog/best-erp-software/

  - https://openalternative.co/categories/business-software/erp-operations

  - https://awesome-selfhosted.net/tags/resource-planning.html

  - https://github.com/topics/erp


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-erp-website
company_website: https://erp.ever.works
