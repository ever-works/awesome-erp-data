markdown: >-
  ## Overview


  OpenConstructionERP is an open-source construction ERP platform with BOQ,
  PDF/CAD/BIM takeoff, AI cost matching, and 293 guided cases. It includes
  120,000+ priced positions, 44 languages, 190+ modules, and cost data for 40+
  markets.


  ## Features


  - Open-source construction ERP

  - BOQ (Bill of Quantities)

  - PDF/CAD/BIM takeoff

  - AI cost matching

  - 293 guided cases

  - 120,000+ priced positions

  - 44 languages

  - 190+ modules

  - Cost data for 40+ markets

  - AGPL-3.0 license


  ## Pricing


  Free and open-source under AGPL-3.0 license. pip install openconstructionerp


  ## Repository


  https://github.com/openconstructionerp/openconstructionerp
