markdown: >-
  ## Overview


  Snipe-IT is an open source IT asset management system that helps organizations
  track hardware and software assets, manage equipment bookings and checkouts,
  prevent double-bookings, and record custody and audit history across multiple
  locations.


  ## Features


  - Asset lifecycle tracking (purchase, assignment, maintenance, retirement)

  - Equipment booking and checkout with double-booking prevention

  - Custody tracking and audit trails across locations

  - License and software asset management

  - Consumables and accessories tracking

  - Location and department management

  - Reporting and audit history

  - REST API for integrations

  - Self-hosted deployment


  ## Pricing


  Free and open source under the AGPL-3.0 license. Self-hosted; community
  support available.


  ## Repository


  https://github.com/snipe/snipe-it
