markdown: >-
  # farmOS


  farmOS is a web-based farm record keeping application designed for managing
  farm operations including crops, livestock, equipment, and financials.


  ## Features


  - Crop and field record keeping

  - Livestock and animal management

  - Equipment and asset tracking

  - Financial logging and activity tracking

  - Map-based field and location management

  - Event and task logging


  ## Deployment


  Self-hosted via PHP and Docker.


  ## License


  GPL-2.0


  ## Repository


  Source code is available on GitHub.
