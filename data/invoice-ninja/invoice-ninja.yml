markdown: >-
  ## Overview


  Invoice Ninja is a free and open-source ERP software platform designed for
  invoicing, accounting, and business management. It is written in PHP and
  supports self-hosted deployment.


  ## Features


  - Invoicing and billing

  - Accounting and expense tracking

  - Client management

  - Payment gateway integrations

  - Recurring invoices

  - Self-hosted deployment

  - Open-source


  ## Pricing


  Free and open-source self-hosted version. Cloud-hosted plans available
  (pricing on website).


  ## Repository


  https://github.com/invoiceninja/invoiceninja
