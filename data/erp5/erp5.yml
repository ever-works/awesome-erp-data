  ## Overview


  ERP5 is an open-source ERP based on a unified model for mid to large size
  organisations.


  ## License and Platform


  - Platform: Python, JavaScript, Zope, or MySQL

  - License: GPL

  - Origin: Worldwide

  - Last stable release: 2014 (5.5)


  ## Pricing


  Free and open-source under the GPL license.
