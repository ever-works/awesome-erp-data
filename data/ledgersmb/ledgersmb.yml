  ## Overview


  LedgerSMB is an open-source double entry accounting and ERP system, originally
  a 2006 fork of SQL-Ledger.


  ## License and Platform


  - Platform: Perl, PostgreSQL

  - License: GPL

  - Origin: Worldwide

  - Last stable release: 2026-July (1.13.7)


  ## Pricing


  Free and open-source under the GPL license.
