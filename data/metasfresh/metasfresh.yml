  ## Overview

  metasfresh is an integrated ERP that began as a friendly fork of ADempiere.

  ## License and Platform

  - Platform: Java, JavaScript, PostgreSQL 9.5
  - License: GPL, Commercial (cloud based)
  - Origin: Worldwide
